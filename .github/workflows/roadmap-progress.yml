name: Atualizar progresso do roadmap

on:
  issues:
    types: [opened, closed, reopened, milestoned, demilestoned]
  milestone:
    types: [opened, closed, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  roadmap-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate milestone progress
        id: milestone-progress
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: milestones } = await github.rest.issues.listMilestones({
              owner,
              repo,
              state: 'open',
              sort: 'due_on',
              direction: 'desc',
              per_page: 10,
            });

            const milestone = milestones[0];

            if (!milestone) {
              core.setOutput('title', 'No active milestone');
              core.setOutput('percent', '0');
              core.setOutput('closed', '0');
              core.setOutput('total', '0');
              core.setOutput('bar', '░░░░░░░░░░░░ 0%');
              return;
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              milestone: milestone.number,
              per_page: 100,
            });

            const tasks = issues.filter((item) => !item.pull_request);
            const closed = tasks.filter((item) => item.state === 'closed').length;
            const total = tasks.length;
            const percent = total === 0 ? 0 : Math.round((closed / total) * 100);
            const totalBlocks = 20;
            const filledBlocks = Math.round((percent / 100) * totalBlocks);
            const bar = `${'█'.repeat(filledBlocks)}${'░'.repeat(totalBlocks - filledBlocks)} ${percent}%`;

            core.setOutput('title', milestone.title);
            core.setOutput('percent', String(percent));
            core.setOutput('closed', String(closed));
            core.setOutput('total', String(total));
            core.setOutput('bar', bar);

      - name: Update README roadmap markers
        env:
          TITLE: ${{ steps.milestone-progress.outputs.title }}
          PERCENT: ${{ steps.milestone-progress.outputs.percent }}
          CLOSED: ${{ steps.milestone-progress.outputs.closed }}
          TOTAL: ${{ steps.milestone-progress.outputs.total }}
          BAR: ${{ steps.milestone-progress.outputs.bar }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          title = os.environ['TITLE']
          percent = os.environ['PERCENT']
          closed = os.environ['CLOSED']
          total = os.environ['TOTAL']
          bar = os.environ['BAR']

          pt_block = (
              "<!-- ROADMAP_PROGRESS_PT_START -->\n"
              f"**Progresso: {percent}%**\n"
              f"{bar}\n\n"
              f"Milestone atual: **{title}**\n"
              f"- Concluídas: {closed}\n"
              f"- Total: {total}\n"
              "<!-- ROADMAP_PROGRESS_PT_END -->"
          )

          en_block = (
              "<!-- ROADMAP_PROGRESS_EN_START -->\n"
              f"**Progress: {percent}%**\n"
              f"{bar}\n\n"
              f"Current milestone: **{title}**\n"
              f"- Completed: {closed}\n"
              f"- Total: {total}\n"
              "<!-- ROADMAP_PROGRESS_EN_END -->"
          )

          text, pt_replaced = re.subn(
              r'<!-- ROADMAP_PROGRESS_PT_START -->.*?<!-- ROADMAP_PROGRESS_PT_END -->',
              pt_block,
              text,
              flags=re.S,
          )

          text, en_replaced = re.subn(
              r'<!-- ROADMAP_PROGRESS_EN_START -->.*?<!-- ROADMAP_PROGRESS_EN_END -->',
              en_block,
              text,
              flags=re.S,
          )

          if pt_replaced == 0 or en_replaced == 0:
              raise SystemExit('Roadmap markers not found in README.md')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README sem alterações."
            exit 0
          fi
          git commit -m "docs: update roadmap progress"
          git push
